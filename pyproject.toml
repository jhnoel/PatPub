[project]
name = "patpub"
version = "0.1.0"
license = "Apache-2.0"
description = "Published patent text, static metadata, and search indexes"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "fts*"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
azure = [
  "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13",
  "zstandard>=0.23,<1",
]
parquet = [
  "pyarrow>=18,<21",
]
router = [
  "zstandard>=0.23,<1",
]
mcp = [
  "mcp>=1.26,<2",
  "starlette>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "fts/tests"]
