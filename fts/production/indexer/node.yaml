version: 0.8
cluster_id: patent-search
node_id: fts-indexer
enabled_services:
  - indexer
  - searcher
  - metastore
  - control_plane
  - janitor
listen_address: 0.0.0.0
advertise_address: 127.0.0.1
data_dir: /work/qwdata
metastore_uri: ${QW_METASTORE_URI:-azure://quickwit/metastores/production-v1}
default_index_root_uri: azure://quickwit/indexes
rest:
  listen_port: 7390
storage:
  azure:
    account: ${QW_AZURE_STORAGE_ACCOUNT}
    access_key: ${QW_AZURE_STORAGE_ACCESS_KEY}
indexer:
  # Bound the in-memory split cache; persistent split data remains in Blob.
  split_store_max_num_bytes: 4G
  split_store_max_num_splits: 1000
  merge_concurrency: 1
ingest_api:
  max_queue_memory_usage: 256MiB
  max_queue_disk_usage: 512MiB
  content_length_limit: 20MiB
