[package]
license = "Apache-2.0"
name = "uspto-ingestion-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake2 = "0.10"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
zstd = "0.13"
patpubrender = "0.2"

[dev-dependencies]
tempfile = "3"
